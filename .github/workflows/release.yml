name: release

# Push a tag like v0.7 (annotated; its message becomes the release notes) to build and publish
# dist/FF8DeckGlyphs.iroj. Junction VIII links to releases/latest/download/FF8DeckGlyphs.iroj.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm fonts-dejavu-core python3-pil
      - name: Build
        run: tools/release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: FF8DeckGlyphs
          path: dist/FF8DeckGlyphs.iroj
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/FF8DeckGlyphs.iroj --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
